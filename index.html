<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mnemoq · Stop making the same mistake twice</title>
    <meta name="description" content="Mnemoq turns every question you get wrong into a smart review card and brings it back right before you forget. Free Digital SAT diagnostic and NSU admission prep, made for students in Bangladesh." />

    <!-- Link previews on Facebook, WhatsApp, Messenger, X, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mnemoq" />
    <meta property="og:title" content="Mnemoq · Stop making the same mistake twice" />
    <meta property="og:description" content="Free SAT diagnostic, a 400-1600 score estimate and smart review of every mistake. Made for students in Bangladesh." />
    <meta property="og:image" content="https://mnemoq-two.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="Mnemoq" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Google Analytics 4 loads after the app is usable (src/googleAnalytics.js). -->

    <!-- The splash: painted at once, replaced when the app mounts. -->
    <style>
      .mq-splash { min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 14px; background: #f7f5f0; color: #16171d; font: 600 18px/1.2 system-ui, sans-serif; }
      .mq-splash svg { animation: mq-splash 1.4s ease-in-out infinite; }
      .mq-splash span { letter-spacing: 0.01em; }
      @keyframes mq-splash { 50% { opacity: 0.6; transform: scale(0.94); } }
      @media (prefers-color-scheme: dark) { .mq-splash { background: #111114; color: #f3f2ee; } }
      @media (prefers-reduced-motion: reduce) { .mq-splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mq-splash" aria-busy="true">
        <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
          <defs><radialGradient id="mq-glow"><stop offset="0" stop-color="#ffd54a" /><stop offset="0.55" stop-color="#ffb321" stop-opacity="0.55" /><stop offset="1" stop-color="#ff8a1c" stop-opacity="0" /></radialGradient></defs>
          <circle cx="36" cy="44" r="26" fill="url(#mq-glow)" />
          <ellipse cx="36" cy="46" rx="10" ry="12" fill="#ffd54a" />
          <circle cx="36" cy="26" r="11" fill="#2a1f4d" />
          <circle cx="32" cy="25" r="2.2" fill="#fff7e0" /><circle cx="40" cy="25" r="2.2" fill="#fff7e0" />
          <path d="M31 15 27 8M41 15 45 8" stroke="#2a1f4d" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span>Mnemoq</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
