<!doctype html>
<!--
  Source for public/og-daily.png, the /daily link preview (Phase 3 wave 3-A, D1).
  Re-render after editing (Windows, from the repo root):
    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new --disable-gpu --hide-scrollbars ^
      --window-size=1200,630 --virtual-time-budget=6000 --screenshot=%CD%\public\og-daily.png %CD%\scripts\og-daily.html
  Copy rules: marketing/brand-voice.md (light words, no claims, real things only).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@500;600&family=Noto+Sans+Bengali:wght@600;700&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: linear-gradient(180deg, #0b0a1f 0%, #1a1640 62%, #2a1f4d 100%);
        color: #fff7e0;
        font-family: Inter, system-ui, sans-serif;
      }
      .stars span { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff7e0; opacity: 0.55; }
      .moon {
        position: absolute; top: 54px; right: 92px; width: 92px; height: 92px; border-radius: 50%;
        background: radial-gradient(circle at 38% 36%, #fffbe6 0%, #ffe9a8 60%, #f2cf74 100%);
        box-shadow: 0 0 60px 18px rgba(255, 228, 150, 0.22);
      }
      .river {
        position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
        background: linear-gradient(180deg, rgba(42, 31, 77, 0) 0%, rgba(20, 16, 52, 0.85) 30%, #0b0a1f 100%);
      }
      .river i { position: absolute; height: 3px; border-radius: 3px; background: rgba(255, 213, 74, 0.28); }
      .jonaki { position: absolute; left: 70px; top: 120px; width: 380px; height: 380px; overflow: visible; }
      .copy { position: absolute; left: 480px; top: 150px; right: 70px; }
      .kicker { font-family: Inter, sans-serif; font-weight: 600; font-size: 24px; letter-spacing: 0.18em; color: #ffd54a; }
      h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 76px; line-height: 1.02; margin-top: 16px; letter-spacing: -0.02em; }
      .bn { font-family: 'Noto Sans Bengali', sans-serif; font-weight: 700; font-size: 40px; margin-top: 14px; color: rgba(255, 247, 224, 0.86); }
      .lanterns { display: flex; gap: 22px; margin-top: 34px; }
      .lanterns b {
        width: 46px; height: 46px; border-radius: 50%;
        background: radial-gradient(circle at 45% 40%, #fffbe6 0%, #ffe27a 35%, #ffb321 80%, #f08a00 100%);
        box-shadow: 0 0 26px 8px rgba(255, 196, 60, 0.5);
      }
      .lanterns b.dim { background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 2px rgba(255, 247, 224, 0.35); }
      .foot { position: absolute; left: 480px; bottom: 50px; font-size: 24px; font-weight: 500; color: rgba(255, 247, 224, 0.72); }
      .foot strong { color: #fff7e0; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="stars">
      <span style="left: 120px; top: 60px"></span><span style="left: 300px; top: 34px"></span><span style="left: 520px; top: 80px"></span>
      <span style="left: 690px; top: 40px"></span><span style="left: 860px; top: 110px"></span><span style="left: 1010px; top: 190px"></span>
      <span style="left: 1140px; top: 260px"></span><span style="left: 60px; top: 220px"></span><span style="left: 420px; top: 130px"></span>
      <span style="left: 760px; top: 150px"></span><span style="left: 960px; top: 36px"></span><span style="left: 230px; top: 110px"></span>
    </div>
    <div class="moon"></div>
    <div class="river">
      <i style="left: 150px; top: 88px; width: 120px"></i><i style="left: 210px; top: 116px; width: 70px"></i>
      <i style="left: 330px; top: 130px; width: 90px"></i>
    </div>

    <!-- Jonaki, happy (static copy of src/components/Jonaki.jsx) -->
    <svg class="jonaki" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <radialGradient id="halo"><stop offset="0" stop-color="#ffd54a" stop-opacity="0.85" /><stop offset="0.45" stop-color="#ffb321" stop-opacity="0.28" /><stop offset="1" stop-color="#ff9f1c" stop-opacity="0" /></radialGradient>
        <radialGradient id="lantern" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#fffbe6" /><stop offset="0.35" stop-color="#ffe27a" /><stop offset="0.8" stop-color="#ffb321" /><stop offset="1" stop-color="#f08a00" /></radialGradient>
        <radialGradient id="body" cx="0.38" cy="0.3" r="0.8"><stop offset="0" stop-color="#5b4a9e" /><stop offset="0.6" stop-color="#35295f" /><stop offset="1" stop-color="#211a40" /></radialGradient>
        <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f1ff" stop-opacity="0.85" /><stop offset="1" stop-color="#a9c4ff" stop-opacity="0.35" /></linearGradient>
      </defs>
      <circle cx="60" cy="84" r="44" fill="url(#halo)" />
      <g fill="url(#wing)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1">
        <ellipse cx="34" cy="62" rx="17" ry="10" transform="rotate(-28 34 62)" />
        <ellipse cx="86" cy="62" rx="17" ry="10" transform="rotate(28 86 62)" />
      </g>
      <ellipse cx="60" cy="86" rx="19" ry="17" fill="url(#lantern)" />
      <path d="M43 80q17 7 34 0" fill="none" stroke="#c96f00" stroke-opacity="0.35" stroke-width="1.6" />
      <path d="M45 90q15 6 30 0" fill="none" stroke="#c96f00" stroke-opacity="0.25" stroke-width="1.4" />
      <g fill="none" stroke="#2a2150" stroke-width="2.6" stroke-linecap="round"><path d="M51 30q-6-12-14-14" /><path d="M69 30q6-12 14-14" /></g>
      <circle cx="37" cy="16" r="3.2" fill="#ffd54a" /><circle cx="83" cy="16" r="3.2" fill="#ffd54a" />
      <circle cx="60" cy="50" r="25" fill="url(#body)" />
      <ellipse cx="51" cy="37" rx="9" ry="5" fill="#ffffff" opacity="0.12" />
      <ellipse cx="42" cy="57" rx="4.2" ry="2.6" fill="#ff7aa8" opacity="0.45" />
      <ellipse cx="78" cy="57" rx="4.2" ry="2.6" fill="#ff7aa8" opacity="0.45" />
      <g fill="none" stroke="#fff7e0" stroke-width="3.2" stroke-linecap="round"><path d="M44 47q5-6 10 0" /><path d="M66 47q5-6 10 0" /></g>
      <path d="M52 58q8 10 16 0z" fill="#3a1d2e" stroke="#3a1d2e" stroke-width="1.6" stroke-linejoin="round" />
    </svg>

    <div class="copy">
      <div class="kicker">MNEMOQ DAILY</div>
      <h1>Five lanterns,<br />one night.</h1>
      <div class="bn">এক রাতে পাঁচটি লণ্ঠন।</div>
      <div class="lanterns"><b></b><b></b><b></b><b></b><b class="dim"></b></div>
    </div>
    <div class="foot">Same five questions for everyone tonight · <strong>English &amp; বাংলা</strong></div>
  </body>
</html>
